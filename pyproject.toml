[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  ".venv",
  "frontend/node_modules",
  "frontend/dist",
  "Padrão de qualidade - Felixo System Design",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
