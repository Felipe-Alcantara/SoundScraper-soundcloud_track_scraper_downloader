name: Build — CLI Linux e Windows

# Dispara em todo push para main (valida o build, sem publicar nada) e em
# toda tag vX.Y.Z (mesmo build, mais o job `release` publicando os dois
# binários). Permite execução manual também.
# Cada job gera um executável standalone no próprio SO (PyInstaller não faz cross-compile).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sufixo: linux-x86_64
            exe: dist/soundcloud-downloader
          - os: windows-latest
            sufixo: windows-x86_64
            exe: dist/soundcloud-downloader.exe

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.sufixo }}

    env:
      # Força UTF-8 no stdout/stderr do Python em todos os SOs (evita UnicodeEncodeError no Windows cp1252).
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deps/requirements-dev.txt

      - name: Instalar FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Instalar FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Instalar dependências Python
        run: pip install -r deps/requirements-dev.txt

      - name: Rodar testes
        run: python -m pytest tests/ -v --tb=short

      - name: Build do executável
        run: python tools/build_ci.py

      - name: Smoke test — verificar binário (Linux)
        if: runner.os == 'Linux'
        run: |
          exe="dist/soundcloud-downloader"
          [ -f "$exe" ] || { echo "ERRO: executável não encontrado"; exit 1; }
          tamanho=$(stat -c%s "$exe")
          echo "Tamanho: $tamanho bytes"
          [ "$tamanho" -gt 10485760 ] || { echo "ERRO: binário menor que 10 MB (build incompleto)"; exit 1; }
          chmod +x "$exe"
          # Verifica que o processo carrega (banner impresso antes de qualquer interação)
          saida=$(echo "" | timeout 10 "$exe" 2>&1 || true)
          echo "$saida" | grep -qi "SOUNDSCRAPER" \
            || { echo "ERRO: banner não encontrado na saída — imports podem ter falhado"; echo "$saida"; exit 1; }
          echo "Smoke test OK"

      - name: Smoke test — verificar binário (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist\soundcloud-downloader.exe"
          if (-not (Test-Path $exe)) { Write-Error "ERRO: executavel nao encontrado"; exit 1 }
          $tamanho = (Get-Item $exe).Length
          Write-Host "Tamanho: $tamanho bytes"
          if ($tamanho -lt 10MB) { Write-Error "ERRO: binario menor que 10 MB (build incompleto)"; exit 1 }
          # Inicia o processo redirecionando stdout para arquivo e mata depois de 5s.
          # Necessario porque o app e interativo; timeout /t nao aceita pipe no Windows.
          # -RedirectStandardInput precisa de arquivo real (nao device NUL) no PowerShell 7.
          $stdin = New-TemporaryFile
          $p = Start-Process -FilePath $exe `
               -RedirectStandardInput  $stdin.FullName `
               -RedirectStandardOutput "smoke_out.txt" `
               -RedirectStandardError  "smoke_err.txt" `
               -PassThru -NoNewWindow
          Start-Sleep 5
          if (-not $p.HasExited) { $p.Kill() }
          $saida = (Get-Content "smoke_out.txt" -Raw -ErrorAction SilentlyContinue) + `
                   (Get-Content "smoke_err.txt" -Raw -ErrorAction SilentlyContinue)
          Write-Host "--- saida do binario ---"
          Write-Host $saida
          if ($saida -notmatch "SOUNDSCRAPER") {
            Write-Error "ERRO: banner nao encontrado — imports podem ter falhado"
            exit 1
          }
          Write-Host "Smoke test OK"

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          # Nome rastreável: SO, arquitetura e SHA curto do commit
          name: soundcloud-downloader-${{ matrix.sufixo }}-${{ github.sha }}
          path: ${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 30

  # Só roda quando o push é de uma tag vX.Y.Z — push para main fica só na
  # validação do job `build` acima, sem publicar Release nenhuma.
  release:
    name: Publicar GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar os dois binários do job de build
        uses: actions/download-artifact@v4
        with:
          pattern: soundcloud-downloader-*-${{ github.sha }}
          path: artefatos
          merge-multiple: false

      # download-artifact preserva o nome do artefato como subpasta; o SHA no
      # nome ajudava a rastrear no job de build, mas quem baixa da Release não
      # quer ver um hash no arquivo — só o SO.
      - name: Renomear para o nome final do binário
        run: |
          set -eu
          mkdir -p release-assets
          mv "artefatos/soundcloud-downloader-linux-x86_64-${{ github.sha }}/soundcloud-downloader" \
             "release-assets/soundcloud-downloader-linux-x86_64"
          mv "artefatos/soundcloud-downloader-windows-x86_64-${{ github.sha }}/soundcloud-downloader.exe" \
             "release-assets/soundcloud-downloader-windows-x86_64.exe"
          chmod +x release-assets/soundcloud-downloader-linux-x86_64
          ls -la release-assets/

      - name: Decidir se esta tag deve virar "Latest"
        id: decidir_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          source .github/scripts/release-version.sh

          tag="${{ github.ref_name }}"
          atual="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          echo "Tag candidata: $tag — Latest atual: ${atual:-<nenhuma>}"

          if is_tag_newer "$tag" "$atual"; then
            echo "flag=--latest" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--latest=false" >> "$GITHUB_OUTPUT"
            echo "$tag não é mais nova que $atual — publicada sem marcar como Latest."
          fi

      - name: Criar a Release, com retentativa em falha transitória da API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          source .github/scripts/retry.sh
          retry 5 5 -- gh release create "${{ github.ref_name }}" \
            release-assets/soundcloud-downloader-linux-x86_64 \
            release-assets/soundcloud-downloader-windows-x86_64.exe \
            --title "SoundScraper ${{ github.ref_name }}" \
            --generate-notes \
            ${{ steps.decidir_latest.outputs.flag }}
